name: learning-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: learning-platform-postgres
    environment:
      POSTGRES_DB: "${DB_NAME:?Copy .env.example to .env}"
      POSTGRES_USER: "${DB_USERNAME:?Copy .env.example to .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Copy .env.example to .env}"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
