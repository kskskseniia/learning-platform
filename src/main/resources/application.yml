spring:
  application:
    name: learning-platform
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
